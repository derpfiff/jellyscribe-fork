# Veröffentlichen: Version in meta.json anheben, Tag „v<Version>“ pushen (z. B. v2.15.0.125).
# Baut gegen Jellyfin 12.4, legt das Zip unter dist/ ab, trägt es in manifest.json ein und hängt es an ein GitHub-Release.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Jellyfin-12.4-Dateien aus dem offiziellen Image holen
        run: |
          mkdir -p lib
          id=$(docker create ghcr.io/jellyfin/jellyfin:12.4)
          for f in MediaBrowser.Common MediaBrowser.Controller MediaBrowser.Model Jellyfin.Data Jellyfin.Database.Implementations Jellyfin.Extensions Newtonsoft.Json; do docker cp "$id:/jellyfin/$f.dll" lib/; done
          docker rm "$id"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Bauen
        run: dotnet build LetterboxdSync/LetterboxdSync.csproj -c Release -o out
      - name: Zip und Katalog
        id: pack
        run: |
          python3 - <<'PY'
          import json, hashlib, zipfile, datetime, os
          meta = json.load(open('meta.json')); ver = meta['version']
          os.makedirs('dist', exist_ok=True)
          zp = 'dist/jellyscribe-fork_%s.zip' % ver
          with zipfile.ZipFile(zp, 'w', zipfile.ZIP_DEFLATED) as z:
              for name, src in [('Jellyscribe.dll', 'out/Jellyscribe.dll'), ('HtmlAgilityPack.dll', 'out/HtmlAgilityPack.dll'), ('meta.json', 'meta.json'), ('whatsnew.json', 'whatsnew.json')]:
                  info = zipfile.ZipInfo(name, (2026, 1, 1, 0, 0, 0)); info.compress_type = zipfile.ZIP_DEFLATED; info.external_attr = 0o644 << 16
                  z.writestr(info, open(src, 'rb').read())
          md5 = hashlib.md5(open(zp, 'rb').read()).hexdigest()
          m = json.load(open('manifest.json'))
          norm = lambda v: tuple((list(map(int, v.split('.'))) + [0, 0, 0, 0])[:4])
          notes = [i['de'][0] + ': ' + i['de'][1] for e in json.load(open('whatsnew.json')) if norm(e['version']) == norm(ver) for i in e.get('items', [])]
          entry = {'version': ver, 'changelog': '\n'.join('- ' + n for n in notes) or 'Siehe CHANGES-JELLYFIN-12.4.md.', 'targetAbi': '12.4.0.0',
                   'sourceUrl': 'https://raw.githubusercontent.com/%s/main/%s' % (os.environ['GITHUB_REPOSITORY'], zp),
                   'checksum': md5, 'timestamp': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')}
          m[0]['versions'] = [entry] + [v for v in m[0]['versions'] if v['version'] != ver]
          json.dump(m, open('manifest.json', 'w'), indent=2, ensure_ascii=False); open('manifest.json', 'a').write('\n')
          open(os.environ['GITHUB_OUTPUT'], 'a').write('zip=%s\nver=%s\n' % (zp, ver))
          PY
      - name: Ins Repository übernehmen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json "${{ steps.pack.outputs.zip }}"
          git diff --cached --quiet || git commit -m "${{ steps.pack.outputs.ver }}: Zip und Katalog"
          git push origin HEAD:main
      - name: GitHub-Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.pack.outputs.ver }}" "${{ steps.pack.outputs.zip }}" --title "${{ steps.pack.outputs.ver }}" --notes "Jellyfin-12.4-Fork, siehe CHANGES-JELLYFIN-12.4.md." || gh release upload "v${{ steps.pack.outputs.ver }}" "${{ steps.pack.outputs.zip }}" --clobber
