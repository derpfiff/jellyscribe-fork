<!DOCTYPE html>
<html>
<head>
    <title>Jellyscribe</title>
</head>
<body>
    <div id="letterboxdSyncConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-button">
        <div data-role="content">
            <div class="content-primary">
                <style>
                /* Fork: im Look von Cinema Glass. Alles hängt an der Seitenwurzel, nichts wirkt nach außen. */
                #letterboxdSyncConfigPage .lbx { --lbx-font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Helvetica Neue", system-ui, sans-serif; --lbx-line: inset 0 0 0 1px rgba(255, 255, 255, .12); --lbx-dim: rgba(255, 255, 255, .62);
                    box-sizing: border-box; max-width: 860px; margin: 0 auto; padding: 36px 40px 80px; color: #fff; font-family: var(--lbx-font); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
                #letterboxdSyncConfigPage .lbx *, #letterboxdSyncConfigPage .lbx *::before, #letterboxdSyncConfigPage .lbx *::after { box-sizing: border-box; }
                #letterboxdSyncConfigPage .lbx-eyebrow { margin: 0 0 6px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: rgba(255, 255, 255, .5); }
                #letterboxdSyncConfigPage .lbx h1 { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -.01em; line-height: 1.15; }
                #letterboxdSyncConfigPage .lbx-intro { margin: 10px 0 0; max-width: 640px; font-size: 15px; color: var(--lbx-dim); }
                #letterboxdSyncConfigPage .lbx-panel { margin-top: 28px; padding: 8px; border-radius: 24px; background: rgba(32, 32, 36, .82); -webkit-backdrop-filter: blur(30px) saturate(1.6); backdrop-filter: blur(30px) saturate(1.6); box-shadow: var(--lbx-line), 0 24px 60px rgba(0, 0, 0, .35); }
                #letterboxdSyncConfigPage .lbx-user { display: flex; align-items: center; gap: 16px; padding: 14px 16px; }
                #letterboxdSyncConfigPage .lbx-user + .lbx-user { box-shadow: 0 -1px 0 rgba(255, 255, 255, .06); }
                #letterboxdSyncConfigPage .lbx-ava { flex: none; position: relative; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; overflow: hidden; background: rgba(255, 255, 255, .1); box-shadow: var(--lbx-line); font-size: 17px; font-weight: 700; }
                #letterboxdSyncConfigPage .lbx-ava img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
                #letterboxdSyncConfigPage .lbx-user__main { flex: 1; min-width: 0; }
                #letterboxdSyncConfigPage .lbx-user__name { font-size: 17px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
                #letterboxdSyncConfigPage .lbx-user__sub { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 4px; font-size: 13.5px; color: var(--lbx-dim); }
                #letterboxdSyncConfigPage .lbx-tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; background: rgba(255, 255, 255, .09); font-size: 12px; font-weight: 600; color: rgba(255, 255, 255, .78); }
                #letterboxdSyncConfigPage .lbx-tag.is-alert { background: #fff; color: #000; }
                #letterboxdSyncConfigPage .lbx-count { flex: none; text-align: right; }
                #letterboxdSyncConfigPage .lbx-count b { display: block; font-size: 26px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
                #letterboxdSyncConfigPage .lbx-count b.is-zero { color: rgba(255, 255, 255, .35); }
                #letterboxdSyncConfigPage .lbx-count span { display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: rgba(255, 255, 255, .5); }
                #letterboxdSyncConfigPage .lbx-count small { display: block; margin-top: 2px; font-size: 12px; color: rgba(255, 255, 255, .42); white-space: nowrap; }
                #letterboxdSyncConfigPage .lbx-empty { padding: 36px 24px; text-align: center; color: var(--lbx-dim); }
                #letterboxdSyncConfigPage .lbx-empty b { display: block; margin-bottom: 6px; color: #fff; font-size: 18px; }
                #letterboxdSyncConfigPage .lbx-ph { display: block; height: 14px; border-radius: 7px; background: rgba(255, 255, 255, .08); }
                @media (max-width: 700px) {
                    #letterboxdSyncConfigPage .lbx { padding: 22px 16px 64px; }
                    #letterboxdSyncConfigPage .lbx h1 { font-size: 30px; }
                    #letterboxdSyncConfigPage .lbx-panel { margin-top: 22px; padding: 4px; border-radius: 22px; }
                    #letterboxdSyncConfigPage .lbx-user { padding: 14px 12px; gap: 12px; }
                    #letterboxdSyncConfigPage .lbx-count small { display: none; }
                }
                </style>

                <div class="lbx">
                    <div class="lbx-eyebrow">Jellyscribe</div>
                    <h1>Letterboxd-Konten</h1>
                    <p class="lbx-intro">Wer sein Letterboxd-Konto verknüpft hat und wie viele Einträge noch auf Letterboxd warten. Verknüpft wird in Cinema Glass unter „Dein Geschmack“; Einträge entstehen nur dort beim „Speichern“.</p>
                    <section class="lbx-panel" id="lbxUsers">
                        <div class="lbx-user"><div class="lbx-ava"></div><div class="lbx-user__main"><span class="lbx-ph" style="width:30%;height:16px;"></span><span class="lbx-ph" style="width:20%;margin-top:10px;"></span></div></div>
                    </section>
                </div>

                <script type="text/javascript">
                (function () {
                    var me = document.currentScript;
                    var root = (me && me.closest('#letterboxdSyncConfigPage')) || document.getElementById('letterboxdSyncConfigPage');
                    if (!root) return;
                    var box = root.querySelector('#lbxUsers');
                    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
                    function hex(id) { return String(id || '').replace(/-/g, '').toLowerCase(); }
                    function avatar(u, name) {
                        var img = u && u.PrimaryImageTag ? '<img alt="" src="' + esc(ApiClient.getUrl('Users/' + u.Id + '/Images/Primary', { tag: u.PrimaryImageTag, maxHeight: 96 })) + '" onerror="this.remove()">' : '';
                        return '<span class="lbx-ava">' + esc(String(name || '?').charAt(0).toUpperCase()) + img + '</span>';
                    }
                    function render(users, rows) {
                        var byId = {}; users.forEach(function (u) { byId[hex(u.Id)] = u; });
                        rows.forEach(function (r) { r.name = (byId[hex(r.userId)] || {}).Name || hex(r.userId).slice(0, 8); });
                        rows.sort(function (a, b) { return a.name.toLowerCase() < b.name.toLowerCase() ? -1 : 1; });
                        if (!rows.length) { box.innerHTML = '<div class="lbx-empty"><b>Noch niemand verknüpft</b>Sobald jemand in Cinema Glass sein Letterboxd-Konto verknüpft, erscheint es hier.</div>'; return; }
                        box.innerHTML = rows.map(function (r) {
                            var tags = ['<span>@' + esc(r.username) + '</span>'];
                            if (!r.enabled) tags.push('<span class="lbx-tag">Senden aus</span>');
                            if (!r.hasLogin) tags.push('<span class="lbx-tag">Keine Anmeldung</span>');
                            if (r.loginFailing) tags.push('<span class="lbx-tag is-alert">Anmeldung scheitert</span>');
                            var q = r.queued || 0, extra = [(r.posted || 0) + ' eingetragen'];
                            if (r.errors) extra.push(r.errors + ' Fehler');
                            return '<div class="lbx-user">' + avatar(byId[hex(r.userId)], r.name) +
                                '<div class="lbx-user__main"><div class="lbx-user__name">' + esc(r.name) + '</div><div class="lbx-user__sub">' + tags.join('') + '</div></div>' +
                                '<div class="lbx-count"><b' + (q ? '' : ' class="is-zero"') + '>' + q + '</b><span>wartend</span><small>' + esc(extra.join(' · ')) + '</small></div></div>';
                        }).join('');
                    }
                    function load() {
                        Promise.all([ApiClient.getUsers(), ApiClient.getJSON(ApiClient.getUrl('LetterboxdLog/Overview'))]).then(function (r) {
                            render(r[0] || [], r[1] || []);
                        }, function () { box.innerHTML = '<div class="lbx-empty"><b>Konnte nicht geladen werden.</b></div>'; });
                    }
                    if (window.ApiClient) load();
                    else root.addEventListener('pageshow', load, { once: true });
                })();
                </script>
            </div>
        </div>
    </div>
</body>
</html>
